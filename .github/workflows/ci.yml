name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        zotero: ["9.0", "10.0.8", "beta"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Download isolated Zotero test runtime
        env:
          ZOTERO_TEST_VERSION: ${{ matrix.zotero }}
        run: |
          mkdir -p .scaffold
          if [ "$ZOTERO_TEST_VERSION" = "beta" ]; then
            url="https://www.zotero.org/download/client/dl?platform=linux-x86_64&channel=beta"
          else
            url="https://www.zotero.org/download/client/dl?platform=linux-x86_64&version=$ZOTERO_TEST_VERSION"
          fi
          curl --fail --location --retry 2 "$url" --output .scaffold/zotero.tar.bz2
          tar -xf .scaffold/zotero.tar.bz2
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$PWD/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"

      - name: Test plugin
        run: npm test

      - name: Build plugin
        run: npm run build
