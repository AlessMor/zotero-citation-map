name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "false"
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Check whether the release already exists
        id: existing-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${process.env.GITHUB_REF_NAME}`, {
            headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: "application/vnd.github+json" },
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Cannot inspect release: HTTP ${response.status}: ${await response.text()}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status === 200}\n`);
          JS

      - name: Build replacement release assets
        if: steps.existing-release.outputs.exists == 'true'
        run: npm run build

      - name: Replace existing release assets and update checksums
        if: steps.existing-release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" .scaffold/build/*.xpi --clobber
          gh release upload release .scaffold/build/update*.json --clobber

      - name: Publish release
        if: steps.existing-release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
